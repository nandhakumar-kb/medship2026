<script>
(() => {
'use strict';
const STORE='medship-working-v1';
const PRODUCTS=['Normal Saline 500ml','Ringer Lactate IV','Insulin Glargine','Dengue NS1 Kit','Ceftriaxone Injection'];
const HOSPITALS=[{id:'H-01',name:'City General Hospital',city:'Chennai',minShelfLifeDays:180},{id:'H-02',name:"St. Mary's Hospital",city:'Coimbatore',minShelfLifeDays:120},{id:'H-03',name:"Sunrise Children's Hospital",city:'Madurai',minShelfLifeDays:270},{id:'H-04',name:'District Rural Hospital',city:'Salem',minShelfLifeDays:90}];
const $=s=>document.querySelector(s); const today=()=>dateOnly(new Date());
function dateOnly(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function offsetDate(n){const d=new Date();d.setDate(d.getDate()+n);return dateOnly(d)}
function daysBetween(a,b){const x=new Date(a+'T00:00:00Z'),y=new Date(b+'T00:00:00Z');return Math.round((y-x)/86400000)}
function fmt(d){return d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—'}
function fmtTime(d){return d?new Date(d).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—'}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function readings(id,values){return values.map((c,i)=>({id:id+'-T'+(i+1),recordedAt:new Date(Date.now()-(values.length-i)*4*3600000).toISOString(),celsius:c}))}
function makeBatch(id,product,expiryOffset,qty,status='RELEASED',values=[]){let cold=['Insulin Glargine','Dengue NS1 Kit'].includes(product);let category=product==='Dengue NS1 Kit'?'DIAGNOSTIC KIT':(['Insulin Glargine','Ceftriaxone Injection'].includes(product)?'INJECTABLE':'IV FLUID');let sku={'Normal Saline 500ml':'NS500','Ringer Lactate IV':'RL500','Insulin Glargine':'INS100','Dengue NS1 Kit':'DNGNS1','Ceftriaxone Injection':'CEF1G'}[product];let storage=cold?'2–8°C':(['Ceftriaxone Injection'].includes(product)?'Below 25°C':'15–25°C');return {id,product,sku,category,storage,coldChain:cold,qualityStatus:status,expiryDate:offsetDate(expiryOffset),manufacturingDate:offsetDate(expiryOffset-540),initialQuantity:qty,availableQuantity:qty,warehouseLocation:'A-01',temperatureLog:readings(id,values),qualityNote:status==='UNDER_QC'?'Awaiting QA release':status==='QUARANTINED'?'11.4°C excursion recorded; QA review required':undefined}}
function seed(){return {version:1,batches:[makeBatch('NS-101',PRODUCTS[0],60,800),makeBatch('NS-102',PRODUCTS[0],200,1000),makeBatch('NS-103',PRODUCTS[0],400,1200),makeBatch('RL-201',PRODUCTS[1],175,600),makeBatch('RL-202',PRODUCTS[1],330,900),makeBatch('INS-301',PRODUCTS[2],150,300,'RELEASED',[4.2,4.5,4.8,5.1,4.7,4.4]),makeBatch('INS-302',PRODUCTS[2],300,400,'QUARANTINED',[4.4,4.8,5.1,11.4,10.2,5.0]),makeBatch('INS-303',PRODUCTS[2],365,350,'RELEASED',[4.1,4.3,4.8,5.2,4.9,4.6]),makeBatch('DNG-401',PRODUCTS[3],100,500,'RELEASED',[4.5,4.7,5,5.3,4.9,4.6]),makeBatch('DNG-402',PRODUCTS[3],280,700,'RELEASED',[4.2,4.4,4.8,5.1,5,4.7]),makeBatch('CEF-501',PRODUCTS[4],500,1000,'UNDER_QC'),makeBatch('CEF-502',PRODUCTS[4],-10,200)],orders:[{id:'ORD-2401',hospitalId:'H-01',product:PRODUCTS[1],quantity:500,createdAt:new Date().toISOString(),status:'OPEN'},{id:'ORD-2402',hospitalId:'H-04',product:PRODUCTS[0],quantity:1200,createdAt:new Date().toISOString(),status:'OPEN'},{id:'ORD-2403',hospitalId:'H-03',product:PRODUCTS[3],quantity:300,createdAt:new Date().toISOString(),status:'OPEN'}],dispatches:[]}}
function load(){try{let x=JSON.parse(localStorage.getItem(STORE));if(!x||x.version!==1||!Array.isArray(x.batches))return seed();x.batches=x.batches.map(b=>b.coldChain&&b.temperatureLog?.some(r=>!Number.isFinite(r.celsius)||r.celsius<2||r.celsius>8)&&b.qualityStatus==='RELEASED'?{...b,qualityStatus:'QUARANTINED',qualityNote:'Temperature excursion detected from recorded readings; QA review required'}:b);return x}catch{return seed()}}
let state=load(),page='Overview',notice=null,search='',statusFilter='ALL',productFilter='ALL',allocation=null,selectedOrder='',orderSeed={hospitalId:'H-01',product:PRODUCTS[0],quantity:400},modal=null,showExcluded=true;
function save(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){console.warn('MedShip could not persist data in this browser:',e)}}
function toast(msg,type='success'){notice={msg,type};render()}
function badge(s){let t=['RELEASED','DISPATCHED','ALLOCATED','IN RANGE'].includes(s)?'green':['QUARANTINED','REJECTED','EXCURSION','UNFULFILLED'].includes(s)?'red':['UNDER_QC','PARTIAL','OPEN','NO EVIDENCE'].includes(s)?'amber':'gray';return `<span class="badge ${t}">${esc(s.replaceAll('_',' '))}</span>`}
function metric(label,val,helper,ico,tone){return `<article class="metric"><div class="metric-top"><span>${esc(label)}</span><span class="metric-icon ${tone}">${ico}</span></div><strong>${esc(val)}</strong><small>${esc(helper)}</small></article>`}
function head(eyebrow,title,desc,action=''){return `<div class="pagehead"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function panelTitle(title,desc,action=''){return `<div class="panel-head"><div><h2>${title}</h2><p>${desc}</p></div>${action}</div>`}
function nav(){let items=[['Overview','▦'],['Batch inventory','▣'],['Hospital orders','▤'],['FEFO allocation','⇄'],['Cold chain','♧'],['Dispatch history','▤']];return `<aside class="sidebar" id="sidebar"><div class="brand"><div class="logo">M</div><div><strong>Med<span>Ship</span></strong><small>PHARMA LOGISTICS</small></div></div><div class="workspace"><i class="dot"></i> DEMO WORKSPACE <span>⌄</span></div><div class="navlabel">WORKSPACE</div><nav class="nav">${items.map(([n,i])=>`<button data-page="${n}" class="${page===n?'active':''}"><span class="ico">${i}</span><span>${n}</span>${n==='Batch inventory'?`<span class="count">${state.batches.length}</span>`:''}</button>`).join('')}</nav><div class="sidebar-bottom"><div class="safety"><b>Safety comes first</b><p>Every allocation checks quality, expiry, cold-chain evidence and customer shelf life.</p><button data-action="demo-allocation">Try a demo allocation →</button></div><div class="version">MedShip · Demo v1.1</div></div></aside>`}
function topbar(){return `<header class="topbar"><div><button class="mobile" data-action="mobile-menu">☰</button><span class="breadcrumb">Workspace　/　<b>${page}</b></span></div><div class="top-right"><label class="searchtop">⌕ <input id="global-search" value="${esc(search)}" placeholder="Search batches, products, hospitals..."></label><span class="env">● Demo environment</span><div class="avatar">QA</div></div></header>`}
function batchRows(batches,compact=false){if(!batches.length)return `<tr><td colspan="${compact?7:7}" class="muted">No matching batches.</td></tr>`;return batches.map(b=>{let rem=daysBetween(today(),b.expiryDate);return `<tr class="rowclick" data-action="batch-detail" data-id="${esc(b.id)}"><td><strong>${esc(b.id)}</strong></td><td><strong>${esc(b.product)}</strong><small>${esc(b.sku)}</small></td><td>${esc(b.storage)}${b.coldChain?'<small>Cold chain</small>':''}</td><td>${badge(b.qualityStatus)}</td><td>${fmt(b.expiryDate)}<small style="color:${rem<=90?'#bc4545':''}">${rem} days remaining</small></td><td class="num">${b.availableQuantity.toLocaleString('en-IN')}</td><td>${compact?'›':esc(b.warehouseLocation)}</td></tr>`}).join('')}
function batchTable(batches,compact=false){return `<div class="tablewrap"><table><thead><tr><th>BATCH ID</th><th>PRODUCT / SKU</th><th>STORAGE</th><th>QUALITY STATUS</th><th>EXPIRY</th><th class="num">AVAILABLE</th><th>${compact?'':'LOCATION'}</th></tr></thead><tbody>${batchRows(batches,compact)}</tbody></table></div>`}
function alertRows(){let out=[];state.batches.filter(b=>b.qualityStatus==='QUARANTINED').forEach(b=>out.push({ico:'♧',tone:'red',title:'Temperature / quality hold',desc:`${b.id} · ${b.qualityNote||'Batch is quarantined'}`,meta:'Quarantined · Dispatch blocked'}));state.batches.filter(b=>b.qualityStatus==='UNDER_QC').forEach(b=>out.push({ico:'▤',tone:'blue',title:'Quality release pending',desc:`${b.id} · ${b.product}`,meta:'Under QC · Dispatch blocked'}));state.batches.filter(b=>b.qualityStatus==='RELEASED'&&daysBetween(today(),b.expiryDate)>=0&&daysBetween(today(),b.expiryDate)<=90).forEach(b=>out.push({ico:'◷',tone:'amber',title:'Expiring soon',desc:`${b.id} expires in ${daysBetween(today(),b.expiryDate)} days`,meta:'Review inventory'}));return out.slice(0,5)}
function overview(){let total=state.batches.reduce((a,b)=>a+b.availableQuantity,0),q=state.batches.filter(b=>b.qualityStatus==='QUARANTINED').length,exp=state.batches.filter(b=>b.qualityStatus==='RELEASED'&&daysBetween(today(),b.expiryDate)>=0&&daysBetween(today(),b.expiryDate)<=90).length,blocked=state.batches.filter(b=>b.qualityStatus!=='RELEASED'||daysBetween(today(),b.expiryDate)<=0||(b.coldChain&&b.temperatureLog.some(r=>r.celsius<2||r.celsius>8))).length;let recent=state.dispatches.slice(0,4);return `${head('WAREHOUSE CONTROL CENTER','Smart pharmaceutical dispatch','Monitor finished goods, verify safe stock and trace every dispatch.',`<button class="btn primary" data-page="FEFO allocation">＋ Allocate order</button>`)}<div class="hero"><div class="hero-text"><div class="hero-tag">QUALITY-LED DISPATCH</div><h2>Right medicine. <span>Right batch.</span><br>Safer tomorrow.</h2><p>Make safer inventory decisions with transparent FEFO allocation and traceable cold-chain evidence.</p></div><div class="hero-art">🏭　🚚</div></div><div class="metrics">${metric('Available inventory units',total.toLocaleString('en-IN'),`Across ${state.batches.length} finished batches`,'▣','blue')}${metric('Quarantined batches',q,'Requires QA disposition','⚑','red')}${metric('Expiring within 90 days',exp,'Released batches only','◷','amber')}${metric('Blocked batches',blocked,'Excluded by safety gates','▤','teal')}</div><div class="grid"><section class="panel">${panelTitle('Batch inventory','Latest quality and expiry status','<button class="link" data-page="Batch inventory">View all →</button>')}${batchTable(state.batches.slice(0,6),true)}<div style="padding-top:10px" class="muted">Showing 6 of ${state.batches.length} batches</div></section><section class="panel">${panelTitle('Attention required','Quality and inventory alerts',`<span class="badge red">${alertRows().length} alerts</span>`)}${alertRows().map(a=>`<div class="alert"><span class="alerticon ${a.tone}">${a.ico}</span><div><b>${a.title}</b><p>${esc(a.desc)}</p><small>${esc(a.meta)}</small></div></div>`).join('')||'<p class="muted">No current alerts.</p>'}</section><section class="panel">${panelTitle('Quick actions','Common warehouse tasks')}<div class="quickgrid"><button class="quick" data-page="FEFO allocation"><span class="qico">🚚</span><b>Allocate order</b><small>Run FEFO checks</small></button><button class="quick" data-action="new-batch"><span class="qico">＋</span><b>Add batch</b><small>Register finished goods</small></button><button class="quick" data-page="Hospital orders"><span class="qico">✚</span><b>Hospital orders</b><small>Manage demand</small></button><button class="quick" data-page="Cold chain"><span class="qico">♧</span><b>Temperature logs</b><small>Review cold chain</small></button></div></section></div><div class="grid bottom"><section class="panel">${panelTitle('Recent dispatches','Confirmed stock movements','<button class="link" data-page="Dispatch history">View all →</button>')}${recent.length?`<div class="tablewrap"><table><thead><tr><th>DISPATCH</th><th>HOSPITAL</th><th>PRODUCT</th><th>QTY</th><th>STATUS</th></tr></thead><tbody>${recent.map(d=>`<tr><td><b>${esc(d.id)}</b><small>${fmtTime(d.confirmedAt||d.createdAt)}</small></td><td>${esc(d.hospitalName)}</td><td>${esc(d.product)}</td><td class="num">${d.allocatedQuantity}</td><td>${badge(d.shortfall?'PARTIAL':'DISPATCHED')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No dispatches recorded yet.</div>'}</section><section class="panel">${panelTitle('Hospital customers','Customer-specific minimum shelf life')}${HOSPITALS.map(h=>`<div class="customer"><span class="initial">${h.name[0]}</span><div><b>${esc(h.name)}</b><small>${esc(h.city)}</small></div><span class="shelf">${h.minShelfLifeDays} days</span></div>`).join('')}</section><section class="panel">${panelTitle('Dispatch safeguards','Mandatory shipping controls','<span class="badge green">ACTIVE</span>')}${['Quality status must be RELEASED','Expiry date must be after ship date','Cold-chain readings must be 2–8°C','Customer shelf-life minimum must pass','Eligible stock sorted by earliest expiry'].map(x=>`<div class="safeguard"><i>✓</i>${x}</div>`).join('')}</section></div>`}
function inventory(){let filtered=state.batches.filter(b=>(`${b.id} ${b.sku} ${b.product}`.toLowerCase().includes(search.toLowerCase()))&&(statusFilter==='ALL'||b.qualityStatus===statusFilter)&&(productFilter==='ALL'||b.product===productFilter));return `${head('INVENTORY MANAGEMENT','Batch inventory','Track finished goods, quality status, expiry, storage conditions and available quantities.',`<button class="btn" data-action="reset">Reset demo</button><button class="btn primary" data-action="new-batch">＋ Add batch</button>`)}<section class="panel"><div class="toolbar"><label class="inputbox">⌕ <input id="batch-search" value="${esc(search)}" placeholder="Search batch, SKU or product"></label><select class="select" id="status-filter"><option value="ALL">All statuses</option>${['RELEASED','UNDER_QC','QUARANTINED','REJECTED'].map(s=>`<option ${statusFilter===s?'selected':''} value="${s}">${s.replaceAll('_',' ')}</option>`).join('')}</select><select class="select" id="product-filter"><option value="ALL">All products</option>${PRODUCTS.map(p=>`<option ${productFilter===p?'selected':''}>${p}</option>`).join('')}</select><span class="muted">${filtered.length} batches</span></div>${batchTable(filtered)}${filtered.length?'':'<div class="empty">No batches match the selected filters.</div>'}</section><section class="panel" style="margin-top:13px">${panelTitle('Quality review queue','Under-QC stock needs a release or rejection decision. Excursion batches remain blocked.')}<div>${state.batches.filter(b=>['UNDER_QC','QUARANTINED'].includes(b.qualityStatus)).map(b=>`<div class="queue-row"><div><b>${esc(b.id)} · ${esc(b.product)} ${badge(b.qualityStatus)}</b><p>${esc(b.qualityNote||'QA review required')}</p></div><div class="queue-actions"><button class="btn small" data-action="qa" data-id="${esc(b.id)}">Record QA review</button></div></div>`).join('')||'<p class="muted">No batches awaiting QA disposition.</p>'}</div></section>`}
function orders(){return `${head('CUSTOMER DEMAND','Hospital orders','Capture hospital requirements and apply each customer’s remaining shelf-life policy.',`<button class="btn primary" data-action="new-order">＋ Create order</button>`)}<div class="metrics">${metric('Open orders',state.orders.filter(o=>o.status==='OPEN').length,'Ready for allocation','▤','blue')}${metric('Hospital customers',HOSPITALS.length,'Active customer profiles','✚','teal')}${metric('Customer policies','4','Minimum shelf-life rules','⚑','amber')}${metric('Dispatch records',state.dispatches.length,'Confirmed in this browser','✓','blue')}</div><section class="panel">${panelTitle('Order register','Allocate only against stock that passes all eligibility gates')}<div class="tablewrap"><table><thead><tr><th>ORDER ID</th><th>HOSPITAL</th><th>PRODUCT</th><th>MIN. SHELF LIFE</th><th>QUANTITY</th><th>CREATED</th><th>STATUS</th><th></th></tr></thead><tbody>${state.orders.map(o=>{let h=HOSPITALS.find(x=>x.id===o.hospitalId);return `<tr><td><b>${esc(o.id)}</b></td><td>${esc(h?.name||'')}</td><td>${esc(o.product)}</td><td>${h?.minShelfLifeDays} days</td><td class="num">${o.quantity.toLocaleString('en-IN')}</td><td>${fmtTime(o.createdAt)}</td><td>${badge(o.status)}</td><td>${o.status==='OPEN'?`<button class="link" data-action="allocate-order" data-id="${esc(o.id)}">Allocate →</button>`:''}</td></tr>`}).join('')}</tbody></table></div></section><section class="panel" style="margin-top:13px">${panelTitle('Hospital shelf-life policy','The remaining days must meet or exceed the customer requirement.') }<div class="policygrid">${HOSPITALS.map(h=>`<div class="policy"><small>${esc(h.city)}</small><b>${esc(h.name)}</b><strong>${h.minShelfLifeDays} days</strong><small>Minimum remaining shelf life</small></div>`).join('')}</div></section>`}
function evaluate(b,h,ship){let rem=daysBetween(ship,b.expiryDate),temps=(b.temperatureLog||[]).map(r=>r.celsius),mn=temps.length?Math.min(...temps):undefined,mx=temps.length?Math.max(...temps):undefined;if(b.qualityStatus==='QUARANTINED')return {ok:false,reason:'QUARANTINED',rem};if(b.qualityStatus==='REJECTED')return {ok:false,reason:'REJECTED',rem};if(b.qualityStatus!=='RELEASED')return {ok:false,reason:'UNRELEASED',rem};if(!Number.isFinite(rem)||rem<=0)return {ok:false,reason:'EXPIRED',rem};if(b.coldChain&&!temps.length)return {ok:false,reason:'MISSING_TEMP_EVIDENCE',rem};if(b.coldChain&&temps.some(t=>!Number.isFinite(t)||t<2||t>8))return {ok:false,reason:'TEMP_EXCURSION',rem};if(rem<h.minShelfLifeDays)return {ok:false,reason:'SHORT_SHELF_LIFE',rem,short:h.minShelfLifeDays-rem};if(b.availableQuantity<=0)return {ok:false,reason:'NO_STOCK',rem};return {ok:true,rem,mn,mx}}
function allocate(product,quantity,hospitalId,orderId=''){if(!Number.isSafeInteger(quantity)||quantity<=0){toast('Enter a positive whole-number quantity.','error');return}let h=HOSPITALS.find(x=>x.id===hospitalId);let valid=[],rejected=[];state.batches.filter(b=>b.product===product).forEach(b=>{let e=evaluate(b,h,today());if(e.ok)valid.push({b,e});else rejected.push({batchId:b.id,reason:e.reason,rem:e.rem,short:e.short})});valid.sort((a,b)=>a.b.expiryDate.localeCompare(b.b.expiryDate)||a.b.id.localeCompare(b.b.id));let left=quantity,picks=[];for(let {b,e} of valid){if(left<=0)break;let take=Math.min(b.availableQuantity,left);if(take>0){picks.push({batchId:b.id,quantity:take,expiryDate:b.expiryDate,remainingShelfLifeDays:e.rem,storage:b.storage,temperatureMin:e.mn,temperatureMax:e.mx});left-=take}}let allocated=quantity-left;allocation={id:'DSP-'+Date.now().toString().slice(-8),createdAt:new Date().toISOString(),shipDate:today(),hospitalId,hospitalName:h.name,product,requestedQuantity:quantity,allocatedQuantity:allocated,shortfall:left,picks,rejected,status:left===0?'ALLOCATED':allocated?'PARTIAL':'UNFULFILLED',orderId};page='FEFO allocation';showExcluded=true;render()}
const reasonLabels={UNRELEASED:'Not quality released',QUARANTINED:'Quarantined — QA review required',REJECTED:'Rejected by QA',EXPIRED:'Expired on ship date',TEMP_EXCURSION:'Temperature excursion detected',MISSING_TEMP_EVIDENCE:'Temperature evidence missing',SHORT_SHELF_LIFE:'Insufficient remaining shelf life',NO_STOCK:'No available stock'};
function allocationPage(){let h=HOSPITALS.find(x=>x.id===(allocation?.hospitalId||'H-01'))||HOSPITALS[0];return `${head('SMART DISPATCH PLANNING','FEFO stock allocation','Apply hard eligibility gates first, then allocate earliest-expiring eligible batches.',`<span class="badge green">● FEFO ENGINE ACTIVE</span>`)}<div class="allocgrid"><section class="panel">${panelTitle('New allocation request','Choose an order or enter an ad hoc shipment request.')}<form id="alloc-form" class="modalform"><div class="field full"><label>Open hospital order (optional)</label><select name="orderId" id="alloc-order"><option value="">Ad hoc allocation</option>${state.orders.filter(o=>o.status==='OPEN').map(o=>`<option value="${esc(o.id)}" ${allocation?.orderId===o.id?'selected':''}>${esc(o.id)} · ${esc(HOSPITALS.find(h=>h.id===o.hospitalId)?.name)} · ${esc(o.product)}</option>`).join('')}</select></div><div class="field full"><label>Hospital customer</label><select name="hospitalId" id="alloc-hospital">${HOSPITALS.map(x=>`<option value="${x.id}" ${(allocation?.hospitalId||'H-01')===x.id?'selected':''}>${esc(x.name)} · ${x.minShelfLifeDays} days minimum</option>`).join('')}</select><small class="hint">Minimum remaining shelf life: ${h.minShelfLifeDays} days</small></div><div class="field full"><label>Product</label><select name="product" id="alloc-product">${PRODUCTS.map(p=>`<option ${(allocation?.product||PRODUCTS[1])===p?'selected':''}>${p}</option>`).join('')}</select></div><div class="field full"><label>Order quantity (units)</label><input name="quantity" type="number" min="1" step="1" required value="${allocation?.requestedQuantity||500}"></div><button class="btn primary" type="submit">✓ Evaluate & allocate stock</button><small class="hint">Allocation is a recommendation. Inventory is deducted only after dispatch confirmation.</small></form></section><section class="panel">${panelTitle('Eligibility sequence','Every gate is mandatory before FEFO sorting.')}${[['01','Quality release','Only RELEASED batches are considered.'],['02','Expiry validation','Expiry must be later than the dispatch date.'],['03','Cold-chain evidence','Cold-chain stock needs readings; every reading must be within 2–8°C.'],['04','Customer shelf life','Remaining days must meet the hospital minimum.'],['05','FEFO sorting','Eligible batches are sorted by earliest expiry date.']].map(g=>`<div class="gate"><span class="gate-num">${g[0]}</span><div><b>${g[1]}</b><p>${g[2]}</p></div></div>`).join('')}</section></div>${allocation?allocationResult():''}`}
function allocationResult(){let r=allocation;return `<section class="panel result">${panelTitle(r.status==='ALLOCATED'?'Stock successfully allocated':r.status==='PARTIAL'?'Partial fulfillment available':'No eligible stock available',`${esc(r.hospitalName)} · ${esc(r.product)} · Requested ${r.requestedQuantity.toLocaleString('en-IN')} units`,badge(r.status))}<div class="result-summary"><div><small>Requested</small><strong>${r.requestedQuantity}</strong></div><div><small>Allocated</small><strong style="color:#16805e">${r.allocatedQuantity}</strong></div><div><small>Shortfall</small><strong style="color:${r.shortfall?'#b33':'inherit'}">${r.shortfall}</strong></div><div><small>Selected batches</small><strong>${r.picks.length}</strong></div></div>${r.picks.length?`${panelTitle('FEFO pick list','Oldest eligible expiry first')}<div class="tablewrap"><table><thead><tr><th>PICK</th><th>BATCH ID</th><th>EXPIRY</th><th>REMAINING SHELF LIFE</th><th>STORAGE EVIDENCE</th><th class="num">QTY</th></tr></thead><tbody>${r.picks.map((p,i)=>`<tr><td>${i+1}</td><td><b>${esc(p.batchId)}</b></td><td>${fmt(p.expiryDate)}</td><td>${p.remainingShelfLifeDays} days</td><td>${esc(p.storage)}${p.temperatureMin!==undefined?`<small>${p.temperatureMin.toFixed(1)}–${p.temperatureMax.toFixed(1)}°C recorded</small>`:''}</td><td class="num"><b>${p.quantity}</b></td></tr>`).join('')}</tbody></table></div>`:''}${r.shortfall?`<div class="shortfall">${r.shortfall} units could not be fulfilled under current eligibility rules.</div>`:''}<div class="excluded"><button data-action="toggle-excluded">Why were other batches excluded? <span>${r.rejected.length} excluded　${showExcluded?'⌃':'⌄'}</span></button>${showExcluded?`<div class="excluded-content">${r.rejected.length?r.rejected.map(x=>`<div class="excluded-row"><strong>${esc(x.batchId)}</strong><span>${reasonLabels[x.reason]||x.reason}${x.reason==='SHORT_SHELF_LIFE'?` — ${x.short} days short` :''}</span></div>`).join(''):'<p class="muted">No matching batches were excluded.</p>'}</div>`:''}</div><div class="result-actions"><button class="btn" data-action="new-allocation">New allocation</button><button class="btn" data-action="print-allocation">Print allocation note</button><button class="btn primary" data-action="confirm-dispatch" ${r.status==='UNFULFILLED'?'disabled':''}>Confirm dispatch →</button></div></section>`}
function tempChart(batch){let vals=batch.temperatureLog.map(x=>x.celsius),w=480,h=155,left=33,right=14,top=12,bottom=25,x=i=>left+(vals.length<2?0:i/(vals.length-1))*(w-left-right),y=v=>top+(14-v)/14*(h-top-bottom),poly=vals.map((v,i)=>`${x(i)},${y(v)}`).join(' '),dots=vals.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="3.5" fill="${v<2||v>8?'#d74444':'#1475d3'}"/>`).join(''),grid=[0,2,4,6,8,10,12,14].map(v=>`<g><line x1="${left}" y1="${y(v)}" x2="${w-right}" y2="${y(v)}" stroke="#e7edf2" stroke-dasharray="3 3"/><text x="${left-8}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="#8a9aaa">${v}</text></g>`).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Recorded temperature line chart"><rect x="${left}" y="${y(8)}" width="${w-left-right}" height="${y(2)-y(8)}" fill="#e4f4f1"/>${grid}<polyline points="${poly}" fill="none" stroke="#1475d3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>${dots}<text x="${w-right}" y="${y(8)-5}" font-size="9" text-anchor="end" fill="#16805e">2–8°C allowed range</text></svg>`}
function temperature(){let cold=state.batches.filter(b=>b.coldChain),inRange=cold.filter(b=>b.temperatureLog.length&&b.temperatureLog.every(r=>r.celsius>=2&&r.celsius<=8)).length,exc=cold.filter(b=>b.temperatureLog.some(r=>r.celsius<2||r.celsius>8)).length;return `${head('COLD-CHAIN COMPLIANCE','Temperature monitoring','Review recorded temperature readings, excursion alerts and batch dispositions.',`<span class="badge blue">REQUIRED RANGE · 2–8°C</span>`)}<div class="metrics">${metric('Cold-chain batches',cold.length,'Temperature-controlled stock','♧','blue')}${metric('Within recorded range',inRange,'All sample readings in range','✓','teal')}${metric('Excursions detected',exc,'Requires QA review','⚑','red')}${metric('Missing evidence',cold.filter(b=>!b.temperatureLog.length).length,'Cannot be allocated','▤','amber')}</div><div class="temperature-grid">${cold.map(b=>{let vals=b.temperatureLog.map(x=>x.celsius),mn=vals.length?Math.min(...vals):undefined,mx=vals.length?Math.max(...vals):undefined,bad=vals.some(x=>x<2||x>8);return `<section class="panel temp-card"><div class="panel-head"><div><h2>${esc(b.id)}</h2><p>${esc(b.product)} · ${esc(b.storage)}</p></div>${badge(bad?'EXCURSION':vals.length?'IN RANGE':'NO EVIDENCE')}</div><div class="chart">${vals.length?tempChart(b):'<div class="empty">No temperature readings recorded</div>'}</div><div class="tempstats"><div><small>MIN</small><strong>${mn===undefined?'—':mn.toFixed(1)+'°C'}</strong></div><div><small>MAX</small><strong style="color:${bad?'#c33':'inherit'}">${mx===undefined?'—':mx.toFixed(1)+'°C'}</strong></div><div><small>READINGS</small><strong>${vals.length}</strong></div><button class="btn small" style="margin-left:auto" data-action="add-reading" data-id="${esc(b.id)}">＋ Add reading</button></div>${b.qualityNote?`<div class="note">⚑ ${esc(b.qualityNote)}</div>`:''}<details style="margin-top:12px"><summary class="muted" style="cursor:pointer">View recorded readings</summary>${b.temperatureLog.map(r=>`<div class="dispatchline">${fmtTime(r.recordedAt)} <b style="float:right;color:${r.celsius<2||r.celsius>8?'#bd3b3b':'#16805e'}">${r.celsius.toFixed(1)}°C</b></div>`).join('')}</details></section>`}).join('')}</div><div class="evidence-note">ⓘ　<strong>Evidence limitation:</strong> These are simulated periodic readings. They do not prove continuous monitoring between readings or uninterrupted temperature control.</div>`}
function history(){let n=state.dispatches;return `${head('TRACEABILITY & AUDIT','Dispatch history','Review confirmed allocations, selected batches, quantities and recorded storage evidence.',`<button class="btn" data-action="export-csv" ${n.length?'':'disabled'}>⇩ Export CSV</button>`)}${n.length?`<div class="metrics">${metric('Confirmed dispatches',n.length,'Saved in this browser','🚚','blue')}${metric('Units dispatched',n.reduce((s,d)=>s+d.allocatedQuantity,0).toLocaleString('en-IN'),'Across all products','▣','teal')}${metric('Hospitals served',new Set(n.map(d=>d.hospitalId)).size,'Unique customers','✚','blue')}${metric('Partial dispatches',n.filter(d=>d.shortfall).length,'Orders with shortfall','◷','amber')}</div><section class="panel">${panelTitle('Dispatch register','Confirmed stock movements',`<span class="badge gray">LOCAL AUDIT LOG</span>`)}<div class="tablewrap"><table><thead><tr><th>DISPATCH ID</th><th>CONFIRMED AT</th><th>HOSPITAL</th><th>PRODUCT</th><th>REQUESTED</th><th>DISPATCHED</th><th>STATUS</th><th></th></tr></thead><tbody>${n.map(d=>`<tr><td><b>${esc(d.id)}</b></td><td>${fmtTime(d.confirmedAt||d.createdAt)}</td><td>${esc(d.hospitalName)}</td><td>${esc(d.product)}</td><td>${d.requestedQuantity}</td><td class="num">${d.allocatedQuantity}</td><td>${badge(d.shortfall?'PARTIAL':'DISPATCHED')}</td><td><button class="link" data-action="print-dispatch" data-id="${esc(d.id)}">Print note</button></td></tr>`).join('')}</tbody></table></div></section>${n.map(dispatchEvidence).join('')}`:`<section class="panel empty"><div style="font-size:31px">🚚</div><b>No dispatches recorded yet</b><p>Run a FEFO allocation and confirm dispatch to create the first audit entry.</p><button class="btn primary" data-page="FEFO allocation">Start an allocation →</button></section>`}`}
function dispatchEvidence(d){return `<section class="panel dispatchcard">${panelTitle(`${esc(d.id)} · ${esc(d.hospitalName)}`,`${fmtTime(d.confirmedAt||d.createdAt)} · ${esc(d.product)}`,`<button class="link" data-action="print-dispatch" data-id="${esc(d.id)}">Print dispatch note ↗</button>`)}${d.picks.map(p=>`<div class="dispatchline"><b>${esc(p.batchId)}</b> · ${p.quantity} units · expiry ${fmt(p.expiryDate)} · ${esc(p.storage)}${p.temperatureMin!==undefined?` · ${p.temperatureMin.toFixed(1)}–${p.temperatureMax.toFixed(1)}°C recorded`:''}</div>`).join('')}</section>`}
function render(){let views={'Overview':overview,'Batch inventory':inventory,'Hospital orders':orders,'FEFO allocation':allocationPage,'Cold chain':temperature,'Dispatch history':history};$('#app').innerHTML=`<div class="app">${nav()}<main class="main">${topbar()}<div class="content">${notice?`<div class="notice ${notice.type}">${notice.type==='error'?'⚠':'✓'} ${esc(notice.msg)}<button data-action="dismiss">✕</button></div>`:''}${views[page]()}<div class="footer"><span>MedShip Demo · Simulated inventory and temperature data</span><span>SMART INVENTORY · SAFE DISPATCH · COMPLETE TRACEABILITY</span></div></div></main>${modal?modalHtml():''}</div>`}
function modalHtml(){let body='',title='',desc='';if(modal.type==='batch'){title='Register finished batch';desc='Newly registered inventory starts UNDER QC and cannot be dispatched until QA release.';body=`<form id="batch-form" class="modalform"><div class="formgrid"><div class="field"><label>Batch ID *</label><input name="id" required placeholder="e.g. NS-104"></div><div class="field"><label>Product *</label><select name="product">${PRODUCTS.map(p=>`<option>${p}</option>`).join('')}</select></div><div class="field"><label>Expiry date *</label><input name="expiryDate" type="date" min="${today()}" value="${offsetDate(365)}" required></div><div class="field"><label>Initial quantity *</label><input name="quantity" type="number" min="1" step="1" value="500" required></div><div class="field"><label>Warehouse location</label><input name="location" value="A-04"></div><div class="field"><label>SKU</label><input name="sku" value="AUTO" placeholder="Product SKU"></div><div class="field full"><span class="hint">Storage temperature and cold-chain requirements are assigned automatically from the selected product. Quality status: UNDER QC.</span></div></div><div class="modalactions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Register batch</button></div></form>`}
if(modal.type==='order'){title='Create hospital order';desc='Create a customer order before running FEFO allocation.';body=`<form id="order-form" class="modalform"><div class="field"><label>Hospital customer</label><select name="hospitalId">${HOSPITALS.map(h=>`<option value="${h.id}">${esc(h.name)} · ${h.minShelfLifeDays} days minimum</option>`).join('')}</select></div><div class="field"><label>Product</label><select name="product">${PRODUCTS.map(p=>`<option>${p}</option>`).join('')}</select></div><div class="field"><label>Order quantity</label><input type="number" min="1" step="1" name="quantity" value="400" required></div><div class="modalactions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Create order</button></div></form>`}
if(modal.type==='reading'){title=`Record temperature · ${esc(modal.batch.id)}`;desc='Add a time-stamped sample reading to the batch evidence record.';body=`<form id="reading-form" class="modalform"><div class="field"><label>Temperature (°C)</label><input type="number" name="temperature" min="-30" max="50" step="0.1" required placeholder="e.g. 5.2" autofocus></div><div class="field"><label>Recorded at</label><input type="text" disabled value="${new Date().toLocaleString('en-IN')}"></div><small class="hint">Any recorded reading below 2°C or above 8°C will automatically place a released batch into quarantine.</small><div class="modalactions"><button class="btn" type="button" data-action="close-modal">Cancel</button><button class="btn primary" type="submit">Save reading</button></div></form>`}
if(modal.type==='qa'){let b=modal.batch;title=`QA review · ${esc(b.id)}`;desc=b.qualityStatus==='UNDER_QC'?'Record a quality release or rejection decision.':'Record a QA disposition. This demo does not allow an excursion batch to be returned to released stock.';body=`<div class="note">${esc(b.qualityNote||'Quality review required.')}</div><form id="qa-form" class="modalform" style="margin-top:12px"><div class="field"><label>QA review note (minimum 8 characters)</label><textarea name="note" rows="4" required minlength="8" placeholder="Record evidence checked and the disposition rationale..."></textarea></div><div class="modalactions">${b.qualityStatus==='UNDER_QC'?`<button class="btn danger" type="button" data-action="qa-reject">Reject batch</button><button class="btn primary" type="submit" value="release">Approve quality release</button>`:`<button class="btn danger" type="button" data-action="qa-reject">Reject batch</button><button class="btn" type="submit" value="hold">Keep quarantined</button>`}</div></form>`}
if(modal.type==='detail'){let b=modal.batch,rem=daysBetween(today(),b.expiryDate),vals=b.temperatureLog.map(r=>r.celsius);title=`Batch details · ${esc(b.id)}`;desc='Finished goods batch record and storage evidence.';body=`<div class="detailgrid"><div><small>Product / SKU</small><strong>${esc(b.product)} · ${esc(b.sku)}</strong></div><div><small>Quality status</small>${badge(b.qualityStatus)}</div><div><small>Storage</small><strong>${esc(b.storage)}</strong></div><div><small>Expiry</small><strong>${fmt(b.expiryDate)} · ${rem} days</strong></div><div><small>Available quantity</small><strong>${b.availableQuantity}</strong></div><div><small>Warehouse location</small><strong>${esc(b.warehouseLocation)}</strong></div><div><small>Temperature readings</small><strong>${vals.length}</strong></div><div><small>Recorded range</small><strong>${vals.length?Math.min(...vals).toFixed(1)+'–'+Math.max(...vals).toFixed(1)+'°C':'No readings'}</strong></div></div>${b.qualityNote?`<div class="note" style="margin-top:12px">${esc(b.qualityNote)}</div>`:''}<div class="modalactions"><button class="btn" data-action="close-modal">Close</button>${['UNDER_QC','QUARANTINED'].includes(b.qualityStatus)?`<button class="btn primary" data-action="qa-from-detail" data-id="${esc(b.id)}">Record QA review</button>`:''}</div>`}
return `<div class="modalback" data-action="backdrop-close"><section class="modal"><div class="modalhead"><div><h2>${title}</h2><p>${desc}</p></div><button class="close" data-action="close-modal">✕</button></div>${body}</section></div>`}
function confirmDispatch(){let r=allocation;if(!r||r.status==='UNFULFILLED')return;let h=HOSPITALS.find(x=>x.id===r.hospitalId);for(let p of r.picks){let b=state.batches.find(x=>x.id===p.batchId);if(!b||!evaluate(b,h,today()).ok||b.availableQuantity<p.quantity){toast(`Dispatch blocked: ${p.batchId} changed or no longer eligible. Re-run allocation.`,'error');allocation=null;return}}if(state.dispatches.some(d=>d.id===r.id)){toast('This dispatch has already been confirmed.','error');return}let now=new Date().toISOString();r.confirmedAt=now;state.batches=state.batches.map(b=>{let p=r.picks.find(x=>x.batchId===b.id);return p?{...b,availableQuantity:b.availableQuantity-p.quantity}:b});state.dispatches.unshift({...r});if(r.orderId)state.orders=state.orders.map(o=>o.id===r.orderId?{...o,status:r.shortfall?'PARTIAL':'DISPATCHED'}:o);save();allocation=null;selectedOrder='';page='Dispatch history';toast('Dispatch confirmed. Stock deducted and local audit evidence saved.');}
function csv(){let head=['Dispatch ID','Confirmed At','Hospital','Product','Requested Qty','Allocated Qty','Shortfall','Batch ID','Batch Qty','Expiry Date','Remaining Shelf Life Days','Storage','Temperature Min C','Temperature Max C'];let rows=state.dispatches.flatMap(d=>d.picks.map(p=>[d.id,d.confirmedAt||d.createdAt,d.hospitalName,d.product,d.requestedQuantity,d.allocatedQuantity,d.shortfall,p.batchId,p.quantity,p.expiryDate,p.remainingShelfLifeDays,p.storage,p.temperatureMin??'',p.temperatureMax??'']));let txt=[head,...rows].map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n');let a=document.createElement('a'),url=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.href=url;a.download='medship-dispatch-history.csv';a.click();URL.revokeObjectURL(url)}
function printDispatch(id){let d=state.dispatches.find(x=>x.id===id)||allocation;if(!d)return;let h=HOSPITALS.find(x=>x.id===d.hospitalId);let w=window.open('','_blank');if(!w){toast('Allow pop-ups to print the dispatch note.','error');return}w.document.write(`<!doctype html><title>MedShip Dispatch ${esc(d.id)}</title><style>body{font:14px Arial;color:#18354e;padding:30px}h1{color:#117e82}table{border-collapse:collapse;width:100%;margin:20px 0}td,th{border:1px solid #ddd;padding:9px;text-align:left}small{color:#777}.note{margin-top:24px;padding:12px;background:#f6f7f8}</style><h1>MedShip · Dispatch Note</h1><h2>${esc(d.id)}</h2><p><b>Hospital:</b> ${esc(d.hospitalName)} · ${esc(h?.city||'')}<br><b>Product:</b> ${esc(d.product)}<br><b>Confirmed:</b> ${fmtTime(d.confirmedAt||d.createdAt)}</p><table><thead><tr><th>Batch</th><th>Expiry</th><th>Qty</th><th>Storage evidence</th></tr></thead><tbody>${d.picks.map(p=>`<tr><td>${esc(p.batchId)}</td><td>${fmt(p.expiryDate)}</td><td>${p.quantity}</td><td>${esc(p.storage)}${p.temperatureMin!==undefined?` · ${p.temperatureMin.toFixed(1)}–${p.temperatureMax.toFixed(1)}°C recorded`:''}</td></tr>`).join('')}</tbody></table><p><b>Requested:</b> ${d.requestedQuantity} · <b>Allocated:</b> ${d.allocatedQuantity} · <b>Shortfall:</b> ${d.shortfall}</p><div class="note"><b>Evidence limitation:</b> Periodic sample readings do not establish continuous temperature monitoring or uninterrupted storage conditions. This is a local demonstration record, not a validated regulated dispatch document.</div><script>window.onload=()=>window.print()<\/script>`);w.document.close()}
function openQa(id){let b=state.batches.find(x=>x.id===id);if(b)modal={type:'qa',batch:b};render()}
document.addEventListener('click',e=>{let el=e.target.closest('[data-page],[data-action]');if(!el)return;if(el.dataset.page){page=el.dataset.page;notice=null;allocation=null;$('#sidebar')?.classList.remove('open');render();return}let a=el.dataset.action,id=el.dataset.id;switch(a){case'mobile-menu':$('#sidebar')?.classList.toggle('open');break;case'dismiss':notice=null;render();break;case'demo-allocation':page='FEFO allocation';allocation=null;render();break;case'new-batch':modal={type:'batch'};render();break;case'new-order':modal={type:'order'};render();break;case'close-modal':modal=null;render();break;case'backdrop-close':if(e.target===el){modal=null;render()}break;case'batch-detail':{let b=state.batches.find(x=>x.id===id);if(b){modal={type:'detail',batch:b};render()}break}case'qa':openQa(id);break;case'qa-from-detail':openQa(id);break;case'qa-reject':{let f=$('#qa-form'),note=new FormData(f).get('note')||'';if(note.trim().length<8){toast('Enter a QA note with at least 8 characters.','error');return}let b=modal.batch;state.batches=state.batches.map(x=>x.id===b.id?{...x,qualityStatus:'REJECTED',qualityNote:String(note).trim(),qaReviewedAt:new Date().toISOString()}:x);modal=null;save();toast(`${b.id} marked REJECTED by QA.`);break}case'allocate-order':{let o=state.orders.find(x=>x.id===id);if(o){page='FEFO allocation';allocate(o.product,o.quantity,o.hospitalId,o.id)}break}case'toggle-excluded':showExcluded=!showExcluded;render();break;case'new-allocation':allocation=null;render();break;case'confirm-dispatch':confirmDispatch();render();break;case'print-allocation':printDispatch(allocation?.id);break;case'print-dispatch':printDispatch(id);break;case'export-csv':csv();break;case'add-reading':{let b=state.batches.find(x=>x.id===id);if(b){modal={type:'reading',batch:b};render()}break}case'reset':if(confirm('Reset sample batches, orders and dispatch history?')){state=seed();save();allocation=null;toast('Sample data has been reset.')}break}}
);
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target;if(f.id==='batch-form'){let d=Object.fromEntries(new FormData(f));let id=d.id.trim().toUpperCase(),qty=Number(d.quantity),expiry=d.expiryDate;if(!id||state.batches.some(b=>b.id.toUpperCase()===id)){toast('Enter a unique batch ID.','error');return}if(!Number.isSafeInteger(qty)||qty<=0){toast('Enter a positive whole-number quantity.','error');return}if(!expiry||expiry<=today()){toast('Expiry date must be after today.','error');return}let product=d.product,b=makeBatch(id,product,daysBetween(today(),expiry),qty,'UNDER_QC');b.expiryDate=expiry;b.warehouseLocation=d.location||'A-01';if(d.sku&&d.sku!=='AUTO')b.sku=d.sku.trim();state.batches.unshift(b);save();modal=null;page='Batch inventory';toast(`${id} registered under QC. QA release is required before allocation.`)}
if(f.id==='order-form'){let d=Object.fromEntries(new FormData(f)),qty=Number(d.quantity);if(!Number.isSafeInteger(qty)||qty<=0){toast('Enter a positive whole-number order quantity.','error');return}let o={id:'ORD-'+Date.now().toString().slice(-7),hospitalId:d.hospitalId,product:d.product,quantity:qty,createdAt:new Date().toISOString(),status:'OPEN'};state.orders.unshift(o);save();modal=null;page='Hospital orders';toast(`${o.id} created successfully.`)}
if(f.id==='alloc-form'){let d=Object.fromEntries(new FormData(f)),o=state.orders.find(x=>x.id===d.orderId);allocate(d.product,Number(d.quantity),d.hospitalId,d.orderId||'')}
if(f.id==='reading-form'){let temp=Number(new FormData(f).get('temperature'));if(!Number.isFinite(temp)||temp < -30||temp>50){toast('Enter a valid temperature between -30°C and 50°C.','error');return}let b=modal.batch,reading={id:b.id+'-T'+Date.now(),recordedAt:new Date().toISOString(),celsius:temp};state.batches=state.batches.map(x=>x.id===b.id?{...x,temperatureLog:[...x.temperatureLog,reading],qualityStatus:temp<2||temp>8?'QUARANTINED':x.qualityStatus,qualityNote:temp<2||temp>8?`Temperature excursion recorded: ${temp.toFixed(1)}°C; QA review required.`:x.qualityNote}:x);modal=null;save();page='Cold chain';toast(temp<2||temp>8?`Excursion at ${temp.toFixed(1)}°C. Batch automatically quarantined.`:`Temperature reading ${temp.toFixed(1)}°C recorded.` ,temp<2||temp>8?'error':'success')}
if(f.id==='qa-form'){let note=String(new FormData(f).get('note')||'').trim();if(note.length<8){toast('Enter a QA note with at least 8 characters.','error');return}let b=modal.batch,submitter=e.submitter;let disposition=submitter?.value||'hold';if(disposition==='release'&&b.qualityStatus!=='UNDER_QC'){toast('Only UNDER QC stock can be released in this demo.','error');return}state.batches=state.batches.map(x=>x.id===b.id?{...x,qualityStatus:disposition==='release'?'RELEASED':x.qualityStatus,qualityNote:note,qaReviewedAt:new Date().toISOString()}:x);modal=null;save();toast(disposition==='release'?`${b.id} quality released after QA review.`:`QA review saved. ${b.id} remains quarantined.`)} });
document.addEventListener('input',e=>{if(e.target.id==='global-search'||e.target.id==='batch-search'){search=e.target.value;if(e.target.id==='global-search'){page='Batch inventory'}render();let x=$('#batch-search');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}}});
document.addEventListener('change',e=>{if(e.target.id==='status-filter'){statusFilter=e.target.value;render()}if(e.target.id==='product-filter'){productFilter=e.target.value;render()}if(e.target.id==='alloc-order'){let o=state.orders.find(x=>x.id===e.target.value);if(o){$('#alloc-hospital').value=o.hospitalId;$('#alloc-product').value=o.product;$('#alloc-form [name=quantity]').value=o.quantity}}});
render();
})();
</script></body></html>
